<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investigations · Operations Copilot</title><style>
:root{--r:#e4002b;--ink:#171719;--muted:#73737c;--line:#e5e5e8;--paper:#f5f5f3;--green:#07845d;--amber:#c76c00}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:#151516;color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;font-size:17px;font-weight:800}.mark{width:34px;height:34px;background:var(--r);border-radius:9px;display:grid;place-items:center}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;color:#888;margin:32px 10px 10px}.nav{display:grid;gap:6px}.nav button{border:0;background:none;color:#aaa;text-align:left;padding:11px 12px;border-radius:9px;font:inherit;cursor:pointer}.nav button:hover,.nav .active{background:#29292b;color:white}.nav b{display:inline-grid;width:24px}.model{position:absolute;bottom:22px;left:18px;right:18px;border:1px solid #333;border-radius:12px;padding:12px;color:#aaa;font-size:12px}.dot{display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:50%;margin-right:7px}main{padding:24px 28px 50px;min-width:0}.top{display:flex;justify-content:space-between;margin-bottom:19px}.top h1{margin:0;font-size:27px;letter-spacing:-1px}.top p{margin:3px 0;color:var(--muted)}.btn,select,input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font:inherit}.btn{font-weight:700;cursor:pointer}.primary{background:var(--r);color:#fff;border-color:var(--r)}.filters{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;gap:8px;margin-bottom:13px}.filters input{min-width:220px}.layout{display:grid;grid-template-columns:325px minmax(0,1fr);gap:13px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px #11111108}.queue{padding:0;overflow:hidden;position:sticky;top:14px}.queue-head{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.queue-head h3,.head h3{margin:0;font-size:15px}.queue-head span,.head span{color:var(--muted);font-size:11px}.items{max-height:calc(100vh - 230px);overflow:auto}.item{padding:14px 15px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#fff5f7}.item.active{box-shadow:inset 3px 0 var(--r)}.item-top{display:flex;justify-content:space-between;align-items:center}.pill{font-size:9px;letter-spacing:.8px;text-transform:uppercase;font-weight:850;padding:3px 7px;border-radius:20px;background:#ffe4e9;color:#b50022}.item h4{margin:8px 0 2px;font-size:13px}.item p{margin:0;color:var(--muted);font-size:11px}.item-bottom{display:flex;justify-content:space-between;margin-top:9px;font-size:11px}.negative{color:var(--r)}.positive{color:var(--green)}.detail{display:grid;gap:13px}.hero{background:linear-gradient(115deg,#211416,#3f141c);color:#fff;border:0}.hero-top{display:flex;justify-content:space-between}.hero .pill{background:#ffffff18;color:#ff9db0}.hero h2{font-size:21px;margin:10px 0 4px}.hero p{color:#d5c7ca;margin:0;max-width:800px}.workflow{display:flex;gap:5px;margin-top:18px}.step{font-size:10px;background:#ffffff12;color:#aaa;padding:6px 9px;border-radius:7px}.step.active{background:#fff;color:#222}.hero-actions{display:flex;gap:8px;margin-top:17px}.hero-actions .btn{background:#fff}.hero-actions .btn.secondary{background:transparent;color:white;border-color:#ffffff44}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.label{font-size:10px;color:var(--muted)}.value{font-size:19px;font-weight:850;letter-spacing:-.5px;margin:5px 0}.sub{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.chart{height:220px}canvas{width:100%;height:100%}.drivers{display:grid;gap:11px}.driver{display:grid;grid-template-columns:130px 1fr 70px;align-items:center;gap:8px;font-size:12px}.track{height:7px;background:#eee;border-radius:9px;overflow:hidden}.track i{display:block;height:100%;background:var(--r);border-radius:9px}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:9px}.evidence-item{border:1px solid var(--line);border-radius:10px;padding:11px}.evidence-item strong{display:block;margin:5px 0}.source{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}.confidence{color:var(--green);font-size:10px}.hypotheses{display:grid;gap:9px}.hypothesis{border:1px solid var(--line);border-radius:11px;padding:12px}.hyp-top{display:flex;gap:10px;justify-content:space-between}.score{font-weight:900;color:var(--r)}.hypothesis ul{padding-left:17px;margin:8px 0;color:#555;font-size:11px}.contra{font-size:10px;color:var(--amber);background:#fff8e8;padding:7px;border-radius:7px}.actions{display:grid;gap:9px}.action{border:1px solid var(--line);border-radius:11px;padding:12px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start}.rank{width:27px;height:27px;background:var(--r);color:#fff;border-radius:7px;display:grid;place-items:center;font-weight:900}.action h4{margin:1px 0 5px;font-size:13px}.meta{color:var(--muted);font-size:10px}.action-controls{display:flex;gap:5px}.action-controls button{font-size:10px;padding:6px 8px}.accepted{border-color:#9ad9c2;background:#f3fcf8}.accepted .rank{background:var(--green)}.disclaimer{font-size:10px;color:var(--muted);text-align:center}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.layout{grid-template-columns:270px 1fr}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.app{display:block}aside{height:auto;position:static;padding:14px 18px}.eyebrow,.model{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.nav button:nth-child(4){display:none}main{padding:16px}.filters{overflow:auto}.filters input{min-width:150px}.layout{grid-template-columns:1fr}.queue{position:static}.items{max-height:300px}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.workflow{overflow:auto}.step{white-space:nowrap}.evidence{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div class="brand"><div class="mark">K</div><div>Operations<br>Copilot</div></div><div class="eyebrow">Workspace</div><nav class="nav"><button onclick="location.href='/'"><b>⌂</b>Control tower</button><button onclick="location.href='/store-monitoring'"><b>⌁</b>Store monitoring</button><button class="active"><b>!</b>Investigations</button><button><b>◇</b>What-if studio</button></nav><div class="model"><span class="dot"></span>Evidence engine online<br><small>Human-in-the-loop workflow</small></div></aside><main><header class="top"><div><h1>Investigations</h1><p>Turn anomalies into evidence, decisions, and accountable actions.</p></div><button class="btn primary" onclick="loadQueue()">↻ Refresh queue</button></header><section class="filters"><input id="search" placeholder="Search store or channel…" oninput="renderQueue()"><select id="severity" onchange="renderQueue()"><option value="all">All severities</option><option>critical</option><option>high</option><option>medium</option></select><select id="status" onchange="renderQueue()"><option value="all">All statuses</option><option value="new">New</option><option value="investigating">Investigating</option><option value="actioned">Actioned</option><option value="resolved">Resolved</option></select></section><div class="layout"><section class="card queue"><div class="queue-head"><div><h3>Investigation queue</h3><span>Ranked by business impact</span></div><b id="queue-count">—</b></div><div class="items" id="queue"><div class="empty">Loading incidents…</div></div></section><section class="detail" id="detail"><div class="card empty">Select an incident to begin investigation.</div></section></div></main></div><script>
let queue=[],selected=null;const $=s=>document.querySelector(s),money=n=>{let a=Math.abs(n);return(n<0?'−':'')+(a>=1e9?(a/1e9).toFixed(1)+'B':(a/1e6).toFixed(1)+'M')+' ₫'},pct=n=>(n*100).toFixed(1)+'%',date=s=>String(s).slice(0,10),state=id=>JSON.parse(localStorage.getItem('investigation:'+id)||'{"status":"new","actions":{}}'),save=(id,s)=>localStorage.setItem('investigation:'+id,JSON.stringify(s));async function get(u){let r=await fetch(u);if(!r.ok)throw Error(await r.text());return r.json()}
async function loadQueue(){let incoming=await get('/api/investigations');incoming.forEach(x=>x.status=state(x.incident_id).status);queue=incoming.filter(x=>x.status!=='resolved');if(selected&&!queue.some(x=>x.incident_id===selected))selected=null;renderQueue();let requested=new URLSearchParams(location.search).get('id'),next=queue.some(x=>x.incident_id===requested)?requested:queue[0]?.incident_id;if(next)openIncident(next);else{$('#detail').innerHTML='<div class="card empty">All detected incidents have been resolved. The investigation queue is clear.</div>';history.replaceState(null,'','/investigations')}}
function renderQueue(){let text=$('#search').value.toLowerCase(),sev=$('#severity').value,st=$('#status').value,items=queue.filter(x=>(x.store_id+' '+x.channel+' '+x.daypart).toLowerCase().includes(text)&&(sev==='all'||x.severity===sev)&&(st==='all'||x.status===st));$('#queue-count').textContent=items.length;$('#queue').innerHTML=items.map(x=>`<div class="item ${x.incident_id===selected?'active':''}" onclick="openIncident('${x.incident_id}')"><div class="item-top"><span class="pill">${x.severity}</span><span class="sub">${x.status}</span></div><h4>${x.store_id} · ${x.daypart} ${x.channel}</h4><p>${date(x.date)} · anomaly score ${(x.anomaly_score*100).toFixed(0)}</p><div class="item-bottom"><b class="negative">${money(x.residual)}</b><span>${pct(x.residual_pct)} vs forecast</span></div></div>`).join('')||'<div class="empty">No incidents match filters.</div>'}
async function openIncident(id){if(!id)return;selected=id;renderQueue();let d=await get('/api/investigations/'+id);renderDetail(d);history.replaceState(null,'','?id='+id)}
function renderDetail(d){let i=d.incident,s=state(i.incident_id);$('#detail').innerHTML=`<article class="card hero"><div class="hero-top"><span class="pill">${i.severity} incident</span><span>${i.store_id} · ${i.region}</span></div><h2>${i.daypart} ${i.channel} sales fell ${pct(Math.abs(i.residual_pct))} below forecast</h2><p>${d.summary}</p><div class="workflow">${['new','investigating','actioned','monitoring','resolved'].map(x=>`<span class="step ${s.status===x?'active':''}">${x}</span>`).join('')}</div><div class="hero-actions"><button class="btn" onclick="setStatus('investigating')">Start investigation</button><button class="btn secondary" onclick="setStatus('resolved')">Mark resolved</button></div></article><section class="kpis"><div class="card"><div class="label">Actual sales</div><div class="value">${money(i.actual_sales)}</div><div class="sub">Incident grain</div></div><div class="card"><div class="label">Expected sales</div><div class="value">${money(i.forecast_sales)}</div><div class="sub">Model baseline</div></div><div class="card"><div class="label">Revenue gap</div><div class="value negative">${money(i.revenue_gap)}</div><div class="sub">Business impact</div></div><div class="card"><div class="label">Residual</div><div class="value negative">${pct(i.residual_pct)}</div><div class="sub">Actual vs forecast</div></div><div class="card"><div class="label">Scope</div><div class="value" style="font-size:14px">${d.scope_assessment.replaceAll('_',' ')}</div><div class="sub">Peer variance ${pct(d.peer_variance)}</div></div></section><section class="grid"><article class="card"><div class="head"><div><h3>Incident timeline</h3><span>Actual vs forecast around detection</span></div></div><div class="chart"><canvas id="incident-chart"></canvas></div></article><article class="card"><div class="head"><div><h3>Revenue-gap decomposition</h3><span>Observed contribution by dimension</span></div></div><div class="drivers">${drivers(d.decomposition)}</div></article></section><section class="grid"><article class="card"><div class="head"><div><h3>Evidence panel</h3><span>Values used by the Copilot</span></div></div><div class="evidence">${evidence(d.evidence)}</div></article><article class="card"><div class="head"><div><h3>Ranked hypotheses</h3><span>Supporting and contradicting evidence</span></div></div><div class="hypotheses">${hypotheses(d.hypotheses)}</div></article></section><article class="card"><div class="head"><div><h3>Recommended actions</h3><span>Prioritized by impact, confidence, and effort</span></div></div><div class="actions">${actions(d.actions,s)}</div></article><div class="disclaimer">${d.disclaimer}</div>`;draw(d.timeline,i.date)}
function drivers(a){let impacts=a.filter(x=>x.revenue_gap),max=Math.max(...impacts.map(x=>Math.abs(x.revenue_gap)),1);return a.map(x=>`<div class="driver"><b>${x.driver}</b><div class="track"><i style="width:${x.revenue_gap?Math.abs(x.revenue_gap)/max*100:35}%"></i></div><span class="${x.revenue_gap<0?'negative':''}">${x.revenue_gap?money(x.revenue_gap):x.observed+' '+x.unit}</span></div>`).join('')}
function evidence(a){return a.map(x=>`<div class="evidence-item"><span class="source">${x.source}</span><strong>${x.label}</strong><div>${x.current}${x.unit?' '+x.unit:''} <span class="sub">vs ${x.baseline}</span></div><div class="confidence">Confidence ${pct(x.confidence)}</div></div>`).join('')}
function hypotheses(a){return a.map((x,n)=>`<div class="hypothesis"><div class="hyp-top"><b>${n+1}. ${x.title}</b><span class="score">${pct(x.confidence)}</span></div><div class="sub">Estimated contribution ${money(x.impact)}</div><ul>${x.support.map(s=>`<li>${s}</li>`).join('')}</ul><div class="contra">Needs validation: ${x.contradiction}</div></div>`).join('')}
function actions(a,s){return a.map(x=>{let ok=s.actions[x.priority]==='accepted';return`<div class="action ${ok?'accepted':''}"><div class="rank">${x.priority}</div><div><h4>${x.action}</h4><div class="meta">${x.owner} · ${x.effort} effort · ${money(x.expected_impact_low)}–${money(x.expected_impact_high)} impact · ${pct(x.confidence)} confidence</div></div><div class="action-controls"><button class="btn" onclick="setAction(${x.priority},'accepted')">${ok?'Accepted ✓':'Accept'}</button><button class="btn" onclick="setAction(${x.priority},'rejected')">Reject</button></div></div>`}).join('')}
function setStatus(status){let s=state(selected);s.status=status;save(selected,s);let q=queue.find(x=>x.incident_id===selected);if(q)q.status=status;openIncident(selected)}function setAction(n,value){let s=state(selected);s.actions[n]=value;if(value==='accepted')s.status='actioned';save(selected,s);let q=queue.find(x=>x.incident_id===selected);if(q)q.status=s.status;openIncident(selected)}
function draw(a,eventDate){let c=$('#incident-chart'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);let vals=a.flatMap(d=>[d.actual_sales,d.forecast_sales]),min=Math.min(...vals)*.96,max=Math.max(...vals)*1.04,p={l:40,r:10,t:12,b:28},px=n=>p.l+n*(w-p.l-p.r)/(a.length-1),py=v=>p.t+(max-v)*(h-p.t-p.b)/(max-min);x.strokeStyle='#eee';for(let n=0;n<4;n++){let y=p.t+n*(h-p.t-p.b)/3;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke()}[['forecast_sales','#aaa',2],['actual_sales','#e4002b',3]].forEach(([k,col,lw])=>{x.strokeStyle=col;x.lineWidth=lw;x.beginPath();a.forEach((d,n)=>n?x.lineTo(px(n),py(d[k])):x.moveTo(px(n),py(d[k])));x.stroke()});x.fillStyle='#777';x.font='10px Segoe UI';a.forEach((d,n)=>{x.fillText(date(d.date).slice(5),px(n)-12,h-7);if(date(d.date)===eventDate){x.fillStyle='#e4002b';x.beginPath();x.arc(px(n),py(d.actual_sales),6,0,Math.PI*2);x.fill();x.fillStyle='#777'}})}
const agentStyle=document.createElement('style');agentStyle.textContent=`.agent-loading{display:grid;grid-template-columns:58px 1fr;gap:17px;align-items:center;padding:13px 4px 7px}.ai-spinner{width:48px;height:48px;border-radius:50%;border:4px solid #f3d9de;border-top-color:var(--r);animation:ai-spin .8s linear infinite;position:relative}.ai-spinner:after{content:'';position:absolute;inset:8px;border-radius:50%;background:#fff4f6;animation:ai-pulse 1.25s ease-in-out infinite}.ai-phase{font-weight:800;font-size:14px;margin-bottom:3px}.ai-detail{color:var(--muted);font-size:11px}.ai-progress{height:5px;background:#eee;border-radius:8px;overflow:hidden;margin-top:12px}.ai-progress i{display:block;height:100%;width:28%;background:linear-gradient(90deg,var(--r),#ff7991);border-radius:8px;animation:ai-progress 1.5s ease-in-out infinite}.ai-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:7px}.mini-spinner{display:inline-block;width:13px;height:13px;border:2px solid #aaa;border-top-color:#222;border-radius:50%;animation:ai-spin .7s linear infinite;vertical-align:-2px;margin-right:7px}#agent-btn:disabled{cursor:wait;opacity:.82}@keyframes ai-spin{to{transform:rotate(360deg)}}@keyframes ai-pulse{50%{transform:scale(.65);opacity:.35}}@keyframes ai-progress{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}`;document.head.appendChild(agentStyle);
const originalRenderDetail=renderDetail;renderDetail=function(d){originalRenderDetail(d);let actions=document.querySelector('.hero-actions');if(actions){let b=document.createElement('button');b.className='btn';b.id='agent-btn';b.textContent='✦ Run AI agent';b.onclick=runAiAgent;actions.prepend(b)}let panel=document.createElement('article');panel.className='card';panel.id='agent-panel';panel.innerHTML='<div class="head"><div><h3>Agent reasoning</h3><span>Autonomous tool-calling investigation</span></div><span>READY</span></div><div class="sub">Run the agent to select investigation tools, collect evidence, and generate a structured reasoning summary.</div>';document.querySelector('#detail .hero').after(panel)};
function startAgentLoading(panel){let started=Date.now(),phase=0,phases=[['Planning investigation','Selecting the most relevant governed tools'],['Reading operational evidence','Checking channel, daypart, peers, ETA and transactions'],['Checking external intelligence','Reviewing Apify delivery, sentiment and competitor signals'],['Testing hypotheses','Comparing supporting and contradicting evidence'],['Synthesizing recommendation','Ranking actions and estimating confidence']];let render=()=>{if(!panel.isConnected)return;let p=phases[Math.min(phase,phases.length-1)];panel.innerHTML=`<div class="head"><div><h3>Agent reasoning</h3><span>Live investigation in progress</span></div><span class="pill">RUNNING</span></div><div class="agent-loading"><div class="ai-spinner" aria-label="AI agent loading"></div><div><div class="ai-phase">${p[0]}</div><div class="ai-detail">${p[1]}</div><div class="ai-progress"><i></i></div><div class="ai-meta"><span>Observe → reason → act → verify</span><span>${((Date.now()-started)/1000).toFixed(1)}s elapsed</span></div></div></div>`};render();let phasesTimer=setInterval(()=>{phase=Math.min(phase+1,phases.length-1);render()},1450),clockTimer=setInterval(render,100);return()=>{clearInterval(phasesTimer);clearInterval(clockTimer)}}
async function runAiAgent(){let btn=document.querySelector('#agent-btn'),panel=document.querySelector('#agent-panel'),incident=selected,start=Date.now();btn.disabled=true;btn.innerHTML='<span class="mini-spinner"></span>Agent investigating';let stopLoading=startAgentLoading(panel);try{let r=await fetch('/api/agent/investigate/'+incident,{method:'POST'});if(!r.ok)throw Error(await r.text());let d=await r.json(),report=d.report;if(!panel.isConnected)return;panel.innerHTML=`<div class="head"><div><h3>Agent reasoning</h3><span>${d.mode} · ${d.model||'no API key'} · ${d.iterations} steps · ${((Date.now()-start)/1000).toFixed(1)}s</span></div><span class="pill">${Math.round((report.confidence||0)*100)}% confidence</span></div><p><b>${report.primary_hypothesis||'Investigation conclusion'}</b></p><p>${report.reasoning_summary||report.executive_summary}</p><div class="workflow">${d.tool_trace.map(t=>`<span class="step active">${t.tool.replaceAll('_',' ')}</span>`).join('')}</div><div class="contra" style="margin-top:12px">Missing evidence: ${(report.missing_evidence||[]).join(' · ')||'None identified'}</div><p class="sub" style="margin-top:12px">${report.disclaimer||''}</p>`}catch(e){if(panel.isConnected)panel.innerHTML='<div class="negative">Agent failed: '+e.message+'</div>'}finally{stopLoading();if(btn.isConnected){btn.disabled=false;btn.textContent='✦ Run AI agent'}}}
document.querySelector('.nav button:nth-child(4)').onclick=()=>location.href='/what-if';addEventListener('resize',()=>selected&&openIncident(selected));loadQueue();
</script></body></html>
